name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: python -m ruff check app tests

      - name: Test (pytest)
        run: python -m pytest --tb=short -q

      - name: Vulnerability scan (pip-audit)
        run: python -m pip_audit -r requirements.txt --progress-spinner=off

      - name: OpenAPI drift check
        run: python -m pytest tests/contract/test_openapi_drift.py --tb=short -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (ng test / Vitest)
        run: npm test

      - name: Lint (ng lint / ESLint + TSDoc)
        run: npm run lint

      - name: Build (production bundle)
        run: npm run build

      - name: Vulnerability scan (npm audit)
        run: npm audit --audit-level=high
